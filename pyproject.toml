[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsaad"
version = "0.1.0"
description = "Time Series Analysis of Area Detectors: calibration-free estimation of detector response statistics (G, gamma, psi) from diffraction rotation scans."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "David Waterman", email = "dgwaterman@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.urls]
Repository = "https://github.com/dagewa/tsaad"

[project.optional-dependencies]
plot = ["matplotlib"]
dxtbx = ["dxtbx"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
tsaad = "tsaad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsaad = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
