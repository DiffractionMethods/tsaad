[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsaad"
version = "0.1.0"
description = "Time Series Analysis of Area Detectors: calibration-free estimation of detector response statistics (G, gamma, psi) from diffraction rotation scans."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "David Waterman", email = "dgwaterman@gmail.com" },
]
keywords = [
    "crystallography",
    "diffraction",
    "detector",
    "gain",
    "point-spread-function",
    "time-series",
    "x-ray",
    "electron-diffraction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/DiffractionMethods/tsaad"
Repository = "https://github.com/DiffractionMethods/tsaad"
Issues = "https://github.com/DiffractionMethods/tsaad/issues"

[project.optional-dependencies]
plot = ["matplotlib"]
dxtbx = ["dxtbx"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
tsaad = "tsaad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsaad = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
