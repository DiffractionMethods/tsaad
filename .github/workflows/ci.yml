name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-package:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install lint and build tools
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[plot,dev]"
      - name: Run ruff
        run: ruff check src/ tests/
      - name: Run mypy
        run: mypy src/tsaad tests/
      - name: Build sdist and wheel & check metadata
        run: |
          python -m build
          twine check --strict dist/*

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[plot,dev]" pytest-xdist
      - name: Check CLI entry point
        run: tsaad --help
      - name: Run pytest (standalone, without dxtbx)
        run: pytest -n auto -v

  test-dxtbx:
    name: Test with dxtbx (conda-forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tsaad-dxtbx
          create-args: >-
            -c conda-forge
            python=3.12
            dxtbx
            matplotlib-base
            pytest
            pytest-xdist
            pip
            "setuptools>=77"
          cache-downloads: true
      - name: Install tsaad (editable, using conda dependencies)
        run: pip install --no-deps --no-build-isolation -e .
      - name: Run full test suite including dxtbx integration
        run: pytest -n auto -v
