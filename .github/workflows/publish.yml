name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build twine
      - name: Verify release tag matches pyproject.toml version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - << 'EOF'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              pkg_ver = tomllib.load(f)["project"]["version"]
          tag = os.environ["RELEASE_TAG"].lstrip("v")
          if tag != pkg_ver:
              sys.exit(f"Tag {os.environ['RELEASE_TAG']!r} does not match pyproject.toml version {pkg_ver!r}")
          print(f"Verified version {pkg_ver}")
          EOF
      - name: Build sdist and wheel
        run: |
          python -m build
          twine check --strict dist/*
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: Publish to PyPI via Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tsaad
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
